[project]
name = "xfeat-onnx-tutorial"
version = "0.1.0"
description = "XFeat to ONNX export tutorial"
requires-python = ">=3.12,<3.13"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { version = "2.3.1", source = "pytorch-cpu" }
numpy = "*"
onnx = "*"
onnxruntime = "1.26.*"
opencv-python-headless = "*"
tqdm = "^4.70.1"
mlflow = "^2.22"
python-dotenv = "^1.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
